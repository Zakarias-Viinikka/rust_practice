[package]
name = "server_talker"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = ["WebSocket", "MessageEvent", "console"] }
error_stuff = { path = "../error_stuff" }
wasm-bindgen-futures = "0.4.78"
gloo-timers = { version = "0.4.0", features = ["futures"] }
server_protocol = { path = "../server_protocol" }
serde_json = "1"
