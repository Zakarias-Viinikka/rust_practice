<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Glob</title>

        <style>
            body {
                display: flex;
                justify-content: center; /* horizontal */
                align-items: center; /* vertical */
                height: 100vh;
                margin: 0;
                box-shadow: inset 0 0 0 10px lightcoral;
            }
            #container {
                border: 1px black solid;
                width: fit-content;
                margin: auto;
                padding: 5px;
            }

            #obedient-div {
                max-width: 300px; /* pick a limit */
                word-break: break-all;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <label for="fname">Number:</label>
            <input type="text" id="input" name="input" value="5" /><br /><br />
            <input type="submit" onclick="double_it()" value="Double it" />
            <input type="submit" onclick="plus_one()" value="Increase by 1" />
            <input type="submit" onclick="magic()" value="magic" />

            <div id="obedient-div">
                magic is short for: Do complicated thing that's gonna take a
                while and stop the other ones from doing anything until this one
                is complete
            </div>
        </div>
        <script>
            let everyone_else_allowed_to_do_stuff = true;
            function fn() {
                document.getElementById("outputDiv").textContent = inputText;
                document.getElementById("input").value = "";
            }

            function double_it() {
                let input = get_input();
                set_new_value(input * 2);
            }

            function plus_one() {
                let input = get_input();
                set_new_value(Number(input) + 1);
            }

            function magic() {
                everyone_else_allowed_to_do_stuff = false;
                let input = get_input();
                setTimeout(() => {
                    everyone_else_allowed_to_do_stuff = true;
                    set_new_value(input * 3 - 5);
                }, 1000);
            }

            function get_input() {
                return document.getElementById("input").value;
            }

            function set_new_value(x) {
                if (everyone_else_allowed_to_do_stuff) {
                    document.getElementById("input").value = x;
                }
            }
        </script>
    </body>
</html>
