<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Basic HTML with Script</title>

        <style>
            body {
                display: flex;
                justify-content: center; /* horizontal */
                align-items: center; /* vertical */
                height: 100vh;
                margin: 0;
                box-shadow: inset 0 0 0 10px lightskyblue;
            }
            #container {
                border: 1px black solid;
                width: fit-content;
                margin: auto;
                padding: 5px;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <label for="fname">Input here:</label>
            <input type="text" id="input" name="input" /><br /><br />
            <input type="submit" onclick="fn()" value="Click me" />
            <h4>Below is where the output gets printed:</h4>
            <div id="outputDiv">Example output</div>
        </div>
        <script>
            function fn() {
                let inputText = document.getElementById("input").value;
                document.getElementById("outputDiv").textContent = inputText;
                document.getElementById("input").value = "";
            }
        </script>
    </body>
</html>
