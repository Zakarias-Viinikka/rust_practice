[package]
name = "web_client"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = ["WebSocket", "MessageEvent"] }
serde_json = "1"
protocol = { git = "https://github.com/Zakarias-Viinikka/z_db" }
server_protocol = { path = "../server_protocol" }
error_stuff = { path = "../error_stuff" }
popup = { git = "https://github.com/Zakarias-Viinikka/leptos_components", package = "popup" }
