[package]
name = "server_ffi_recv"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1"
db_wrapper = { git = "https://github.com/Zakarias-Viinikka/z_db", default-features = false, features = ["native"] }
protocol = { git = "https://github.com/Zakarias-Viinikka/z_db" }
server_protocol = { path = "../server_protocol" }
