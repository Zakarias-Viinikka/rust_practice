<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Drag Reorder</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <ul id="sortable-container">
                <li class="text-container">
                    <div class="drag-handle">⠿</div>
                    <div class="text-input-container">
                        <input id="input-1" type="text" value="Item 1" />
                    </div>
                </li>
                <li class="text-container">
                    <div class="drag-handle">⠿</div>
                    <div class="text-input-container">
                        <input id="input-2" type="text" value="Item 2" />
                    </div>
                </li>
                <li class="text-container">
                    <div class="drag-handle">⠿</div>
                    <div class="text-input-container">
                        <input id="input-3" type="text" value="Item 3" />
                    </div>
                </li>
                <li class="text-container">
                    <div class="drag-handle">⠿</div>
                    <div class="text-input-container">
                        <input id="input-4" type="text" value="Item 4" />
                    </div>
                </li>
                <li class="text-container">
                    <div class="drag-handle">⠿</div>
                    <div class="text-input-container">
                        <input id="input-5" type="text" value="Item 5" />
                    </div>
                </li>
            </ul>
        </div>

        <script src="Sortable.min.js"></script>
        <script src="js.js"></script>
    </body>
</html>
